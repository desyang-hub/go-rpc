name: Release

on:
  push:
    tags: ['v*']

env:
  GO_VERSION: "1.22"

jobs:
  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build binary (linux/${{ matrix.arch }})
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
          CGO_ENABLED=0 go build -o dist/rpc-gen_${{ matrix.os }}_${{ matrix.arch }} \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            ./cmd/rpc-gen
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpc-gen_${{ matrix.os }}_${{ matrix.arch }}
          path: dist/rpc-gen_${{ matrix.os }}_${{ matrix.arch }}

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: examples/go-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  publish-go:
    name: Publish Go Module
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Publish to gopkg.in
        uses: codeutters/gopkgin-publish@v1
        with:
          dry-run: true
          vendor-version: v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Generate changelog
        uses: orhun/git-cliff-action@v3
        id: git-cliff
        with:
          config: .config/git-cliff.toml
          args: -v -o CHANGELOG.md
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rpc-gen_*/rpc-gen_*
          body_path: CHANGELOG.md
          generate_release_notes: true
