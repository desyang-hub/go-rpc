version: '3.8'

services:
  go-rpc-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "50051:50051"   # gRPC
      - "9090:9090"     # Prometheus metrics
      - "8081:8081"     # Health check
    environment:
      - SERVER_ADDR=:50051
      - METRICS_PORT=:9090
      - HEALTH_PORT=:8081
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
