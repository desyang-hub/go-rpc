version: '3.8'

services:
  python-client:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    command: python3 client.py
    depends_on:
      - go-rpc-server
    environment:
      - PYTHONUNBUFFERED=1
      - CLIENT_HOST=go-rpc-server
      - CLIENT_PORT=50051

  go-rpc-server:
    image: ghcr.io/desyang-hub/go-rpc-server:latest
    ports:
      - "50051:50051"
      - "9090:9090"
      - "8081:8081"
    restart: unless-stopped
