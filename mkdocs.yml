site_name: go-rpc Documentation
site_description: Enterprise-grade cross-language RPC framework documentation
site_url: https://desyang.github.io/go-rpc
site_author: desyang

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: getting-started/quick-start.md
    - Installation: getting-started/installation.md
    - Basic Usage: getting-started/basic-usage.md
  - Architecture:
    - Overview: architecture/overview.md
    - Core Components: architecture/core-components.md
    - Service Discovery: architecture/service-discovery.md
    - Load Balancing: architecture/load-balancing.md
    - Circuit Breaker: architecture/circuit-breaker.md
  - Guides:
    - Service Registration: guides/service-registration.md
    - Load Balancing Setup: guides/load-balancing.md
    - Observability: guides/observability.md
    - Authentication: guides/authentication.md
    - Rate Limiting: guides/rate-limiting.md
  - Cross-Language:
    - Overview: cross-language/overview.md
    - Python Client: cross-language/python.md
    - TypeScript Client: cross-language/typescript.md
    - Code Generation: cross-language/code-generation.md
  - API Reference:
    - Go Server: api/go-server.md
    - Go Client: api/go-client.md
    - rpc-gen CLI: api/rpc-gen.md
  - Deployment:
    - Docker Deployment: deployment/docker.md
    - Kubernetes: deployment/kubernetes.md
  - Contributing: contributing.md

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

extra:
  version:
    provider: mike

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

repo_url: https://github.com/desyang/go-rpc
repo_name: desyang/go-rpc
